name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Accounts.API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Accounts/BankCore.Accounts.API/Dockerfile
          push: false

      - name: Build Transactions.API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Transactions/BankCore.Transactions.API/Dockerfile
          push: false

      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Gateway/BankCore.Gateway/Dockerfile
          push: false
